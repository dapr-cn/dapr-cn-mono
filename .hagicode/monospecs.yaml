version: "1.0"

# Repositories of the dapr-cn organization, cloned into repos/ (ignored by this repo).
# Run `npm run sync:repos` to clone missing ones and fast-forward existing clean ones.
# status: active (pushed in 2026) | stale (last push 2021–2025) | archived | fork (mirror of an upstream project)

repositories:
- path: "repos/docs"
  url: "https://github.com/dapr-cn/docs.git"
  displayName: "docs"
  tags: [ content, translation, docs, status-active ]
  status: "active"
  note: "Chinese translation of the Dapr documentation; holds monospecs.yaml; its OpenSpec specs now live in the mono repo under openspec/."

- path: "repos/agent-skills"
  url: "https://github.com/dapr-cn/agent-skills.git"
  displayName: "agent-skills"
  tags: [ tooling, agent-skills, translation, status-active ]
  status: "active"
  note: "Agent skills of the organization: dapr-docs-translation, dapr-docs-translate-incremental, dapr-docs-translation-verify, dapr-docs-version-bootstrap, dapr-docs-upstream-pr."

- path: "repos/fork-docs"
  url: "https://github.com/dapr-cn/fork-docs.git"
  displayName: "fork-docs"
  tags: [ fork, docs, v1.17, status-active ]
  status: "fork"
  note: "Fork of dapr/docs; default branch v1.17 is kept in sync with upstream."

- path: "repos/dapr-cn-site"
  url: "https://github.com/dapr-cn/dapr-cn-site.git"
  displayName: "dapr-cn-site"
  tags: [ site, hugo, status-stale ]
  status: "stale"
  note: "Community website; last push 2025-08-19; deployed to Azure Static Web Apps."

- path: "repos/dapr-cn.github.io"
  url: "https://github.com/dapr-cn/dapr-cn.github.io.git"
  displayName: "dapr-cn.github.io"
  tags: [ publish, gh-pages, status-stale ]
  status: "stale"
  note: "Published static output of dapr-cn/docs (gh-pages branch); last push 2021-11-13."

# Versioned checkouts read and written by the zh data tasks (zh:data:sync, zh:data:repair).
# `branch` is the branch provisioning clones or switches to; `optional: true` skips the entry
# instead of failing when its remote or branch is unreachable.
- path: "repos/v1.17"
  url: "https://github.com/dapr/docs.git"
  displayName: "v1.17"
  branch: "v1.17"
  tags: [ data, upstream, source ]
  status: "active"
  note: "Upstream Dapr docs for v1.17; source documents for the zh data sync (required)."

- path: "repos/v1.17_zh"
  url: "https://github.com/dapr/docs-zh.git"
  displayName: "v1.17_zh"
  branch: "v1.17_content"
  tags: [ data, zh-official ]
  status: "active"
  note: "Chinese translation data for v1.17; written by zh:data:sync (required)."

- path: "repos/v1.15"
  url: "https://github.com/dapr/docs.git"
  displayName: "v1.15"
  branch: "v1.15"
  optional: true
  tags: [ data, upstream, source ]
  status: "active"
  note: "Upstream Dapr docs for v1.15; source documents for the zh data sync (optional)."

- path: "repos/v1.15_zh"
  url: "https://github.com/dapr/docs-zh.git"
  displayName: "v1.15_zh"
  branch: "v1.15_content"
  optional: true
  tags: [ data, zh-official ]
  status: "active"
  note: "Chinese translation data for v1.15; written by zh:data:sync (optional)."

- path: "repos/v1.19"
  url: "https://github.com/dapr/docs.git"
  displayName: "v1.19"
  branch: "v1.19"
  tags: [ data, upstream, source ]
  status: "active"
  note: "Upstream Dapr docs for v1.19; source documents for the zh data sync (required)."

- path: "repos/v1.19_zh"
  url: "https://github.com/dapr/docs-zh.git"
  displayName: "v1.19_zh"
  branch: "v1.19_content"
  tags: [ data, zh-official ]
  status: "active"
  note: "Chinese translation data for v1.19; written by zh:data:sync (required)."
